id: B6
name: Stuck valve
layers: [twin, guardian, brain]
description: >
  Flood at the port; valve-01 is stuck: it acknowledges `done` but nothing changes. The Brain sees
  no effect, marks the command failed, raises an alert and decides again without valve-01.
trigger: python scenarios/run.py B6
expected:
  twin: Flood in zone-01 from 5 s; valve-01 answers `done` but the water keeps rising.
  guardian: water-01 trusted.
  brain: Command valve-01 open, ack done, then outcome failed (no effect) and brain/alert actuator_no_effect; a new decision without valve-01; valve-01 never opened twice.
how_to_verify: >
  Timeline: command valve-01 -> ack -> no effect -> alert -> new decision. logs/B6-*.log: the alert
  line for valve-01 and a second decision line, one valve-01 open command.
duration_s: 90
observe: {readings: [water-01]}
twin:
  reset: {seed: 7, scenario: flood, scenario_zone: zone-01, scenario_after_ticks: 5}
  actuator_modes: {valve-01: stuck}
guardian: {modes: [auto]}
expect:
  - {command: {target_id: valve-01, action: open}, within_s: 30}
  - {ack: done, match: {actuator_id: valve-01}, within_s: 35}
  - {alert: actuator_no_effect, match: {target_id: valve-01}, within_s: 80}
  - {outcome: failed, match: {target_id: valve-01}, within_s: 80}
  - {decision: any, count: 2, within_s: 88}
  - {max_commands: {target_id: valve-01, action: open, count: 1}}
