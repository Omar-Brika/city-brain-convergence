# Shared MQTT broker (spec TR-1, TR-3). Every Brain module reads this file.
host: localhost
port: 8883              # TLS only (SEC-1)
keepalive_s: 30
reconnect_min_s: 1      # auto-reconnect back-off (TR-8)
reconnect_max_s: 30
client_ids:             # fixed client ids (TR-4); extra modules use a suffix
  input: brain
  default_prefix: brain-
